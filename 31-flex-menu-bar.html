<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Responsive Menu Bar using Flexbox by Bhoomi">
    <title>Flexbox Menu Bar - Bhoomi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #ffffff;
            color: #0f172a;
            line-height: 1.6;
        }

        /* Flexbox Navigation Bar */
        .menu {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1e293b;
            padding: 1rem 2rem;
            flex-wrap: wrap;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .menu_brand {
            color: #ffffff;
            font-weight: 700;
            font-size: 1.25rem;
        }

        .menu_list {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }

        .menu_list a {
            display: block;
            color: #cbd5e1;
            text-decoration: none;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s;
            font-weight: 500;
        }

        .menu_list a:hover,
        .menu_list a.active {
            color: #ffffff;
            background: #334155;
        }

        .menu_cta {
            background: #2563eb;
            color: #ffffff;
            padding: 0.5rem 1.25rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
        }

        .menu_cta:hover {
            background: #1d4ed8;
        }

        /* Main Content Container */
        main {
            max-width: 800px;
            margin: 3rem auto;
            padding: 0 1.5rem;
            text-align: center;
        }

        main h1 {
            color: #1e293b;
            margin-bottom: 1rem;
        }

        main p {
            color: #64748b;
        }

        /* Responsive: stack on small screens */
        @media (max-width: 768px) {
            .menu {
                flex-direction: column;
                align-items: stretch;
                gap: 1rem;
                padding: 1rem;
            }

            .menu_brand {
                text-align: center;
            }

            .menu_list {
                flex-direction: column;
                align-items: center;
                gap: 0.5rem;
            }

            .menu_cta {
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- Flex Menu Bar -->
    <nav class="menu" aria-label="Main">
        <div class="menu_brand">Bhoomi's Hub</div>
        <ul class="menu_list">
            <li><a href="#home" class="active">Home</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#portfolio">Portfolio</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
        <a href="#signin" class="menu_cta">Sign In</a>
    </nav>

    <main>
        <h1>Responsive Flexbox Navigation</h1>
        <p>Resize the window or view on mobile devices to see the menu stack gracefully.</p>
    </main>

</body>
</html>
