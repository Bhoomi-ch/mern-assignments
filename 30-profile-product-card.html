<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Profile card and product card components by Bhoomi.">
    <title>Profile & Product Cards - Bhoomi</title>
    <style>
        :root {
            --primary: #2563eb;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #ffffff;
            color: #0f172a;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            padding: 2rem 1rem;
        }

        /* PROFILE CARD */
        .profile {
            width: 320px;
            background: #ffffff;
            border-radius: var(--radius);
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            text-align: center;
            overflow: hidden;
        }

        .profile_cover {
            height: 100px;
            background: linear-gradient(135deg, var(--primary), #1e293b);
        }

        .profile_avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            object-fit: cover;
            margin-top: -45px;
            background: #f1f5f9;
        }

        .profile_body {
            padding: 1rem 1.5rem 1.5rem 1.5rem;
        }

        .profile h2 {
            margin: 0.5rem 0 0 0;
            font-size: 1.25rem;
        }

        .profile p {
            color: #64748b;
            margin: 0.25rem 0 1rem 0;
            font-size: 0.9rem;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #f1f5f9;
            padding-top: 1rem;
            margin-bottom: 1.25rem;
        }

        .stats strong {
            display: block;
            font-size: 1.1rem;
            color: #0f172a;
        }

        .stats span {
            font-size: 0.8rem;
            color: #64748b;
        }

        .btn {
            display: inline-block;
            background: var(--primary);
            color: #ffffff;
            padding: 0.6rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        /* PRODUCT CARD */
        .product {
            width: 320px;
            background: #ffffff;
            border-radius: var(--radius);
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            position: relative;
        }

        .product img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .product_tag {
            position: absolute;
            top: 12px;
            left: 12px;
            background: #0f172a;
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
        }

        .product_body {
            padding: 1.25rem 1.5rem 1.5rem 1.5rem;
        }

        .product h2 {
            margin: 0 0 0.5rem 0;
            font-size: 1.2rem;
        }

        .rating {
            color: #f59e0b;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }

        .price {
            margin: 0 0 1rem 0;
            font-weight: 600;
        }

        .price strong {
            font-size: 1.25rem;
            color: #0f172a;
        }

        .price s {
            color: #94a3b8;
            margin-left: 0.5rem;
            font-weight: normal;
        }

        .product .btn {
            display: block;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Profile Card -->
    <article class="profile">
        <div class="profile_cover"></div>
        <img class="profile_avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&h=200&fit=crop&crop=faces&auto=format&q=80" alt="Girl Silhouette">
        <div class="profile_body">
            <h2>Bhoomi</h2>
            <p>BCA AI Student &bull; Moradabad</p>
            <div class="stats">
                <div>
                    <strong>14</strong>
                    <span>Projects</span>
                </div>
                <div>
                    <strong>1.5k</strong>
                    <span>Followers</span>
                </div>
                <div>
                    <strong>42</strong>
                    <span>Commits</span>
                </div>
            </div>
            <a href="#" class="btn">Connect</a>
        </div>
    </article>

    <!-- Product Card -->
    <article class="product">
        <span class="product_tag">AI Spec</span>
        <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e" alt="Wireless Headphones">
        <div class="product_body">
            <h2>Wireless Headphones</h2>
            <div class="rating" aria-label="5 out of 5 stars">&#9733;&#9733;&#9733;&#9733;&#9733; (214)</div>
            <div class="price"><strong>₹1,799</strong> <s>₹2,999</s></div>
            <a href="#" class="btn">Add to Cart</a>
        </div>
    </article>

</body>
</html>
